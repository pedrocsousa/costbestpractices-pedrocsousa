- description: Select the appropriate AKS Tier
  acorlGuid: 4377cee6-dbbc-448a-9c7a-74ec87116719
  recommendationTypeId: null
  recommendationControl: UsageOptimization/OptimizeResources
  recommendationImpact: Medium
  recommendationResourceType: Microsoft.ContainerService/managedClusters
  recommendationMetadataState: Active
  remediationAction: |
    Use the Free Tier for development and testing to avoid control plane costs, paying only for VMs, storage, and networking. Choose the Standard Tier for production workloads needing scalability, performance, and uptime SLA support. For mission-critical workloads, opt for the Premium Tier, which offers high availability, a financially backed SLA, and extended Kubernetes version support.
  potentialBenefits: Optimize existing resources
  pgVerified: false
  publishedToLearn: false
  automationAvailable: false
  tags: null
  learnMoreLink:
    - name: Free, Standard, and Premium pricing tiers for Azure Kubernetes Service (AKS) cluster management
      url: "https://learn.microsoft.com/en-us/azure/aks/free-standard-pricing-tiers"

